services:
  # PostgreSQL Database Service
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: kirabel@123
      POSTGRES_DB: samaria_erp
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - samaria-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d samaria_erp"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Next.js Application Service
  app:
    build:
      context: .
      dockerfile: Dockerfile.dokploy
    restart: always
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:kirabel@123@db:5432/samaria_erp
      NEXTAUTH_SECRET: samaria1995
      NEXTAUTH_URL: https://app.samariaerp.org
      NEXT_PUBLIC_APP_URL: https://app.samariaerp.org
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - samaria-network
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # No port exposure - nginx handles all external access

  # Nginx Proxy Server
  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"          # HTTP (redirects to HTTPS)
      - "443:443"        # HTTPS (main access point)
      - "8080:8080"      # HTTP fallback (for development)
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./uploads:/app/public/uploads:ro
      # SSL certificates volume (create these or use Let's Encrypt)
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - samaria-network
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres-data:
    driver: local

networks:
  samaria-network:
    driver: bridge