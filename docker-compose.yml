services:
  # PostgreSQL Database Service
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: kirabel@123
      POSTGRES_DB: samaria_erp
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d samaria_erp"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Next.js Application Service
  app:
    build:
      context: .
      dockerfile: Dockerfile.dokploy
    restart: always
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:kirabel@123@db:5432/samaria_erp
      NEXTAUTH_SECRET: samaria1995
      NEXTAUTH_URL: https://app.samariaerp.org
      NEXT_PUBLIC_APP_URL: https://app.samariaerp.org
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # Traefik labels for Dokploy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.samaria-app.rule=Host(`app.samariaerp.org`)"
      - "traefik.http.routers.samaria-app.entrypoints=websecure"
      - "traefik.http.routers.samaria-app.tls.certresolver=letsencrypt"
      - "traefik.http.services.samaria-app.loadbalancer.server.port=3000"
      - "traefik.http.middlewares.samaria-app-headers.headers.customrequestheaders.X-Forwarded-Proto=https"
      - "traefik.http.routers.samaria-app.middlewares=samaria-app-headers"

volumes:
  postgres-data:
    driver: local
