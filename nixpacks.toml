# Nixpacks configuration for Samaria ERP (Next.js 14 + Prisma)
# https://nixpacks.com/docs/configuration/file

[phases.setup]
# Node.js with OpenSSL for Prisma
nixPkgs = ["...", "openssl"]

[phases.install]
# legacy-peer-deps needed for this dependency tree
cmds = ["npm install --legacy-peer-deps"]

[phases.build]
# Prisma generate needs DATABASE_URL set (doesn't connect, just reads the schema)
cmds = [
  "npx prisma generate",
  "npm run build"
]

[phases.build.variables]
DATABASE_URL = "postgresql://samaria:kirabel@123@samaria-erp-samariadb-bdkfz6:5432/samaria_erp"

[start]
# Run pending migrations, copy static assets into standalone dir, then start
cmd = "npx prisma migrate deploy && cp -r .next/static .next/standalone/.next/static && cp -r public .next/standalone/public && node .next/standalone/server.js"

