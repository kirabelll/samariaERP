# Nixpacks configuration for Samaria ERP (Next.js 14 + Prisma)
# https://nixpacks.com/docs/configuration/file

[phases.setup]
# Node.js with OpenSSL for Prisma
nixPkgs = ["...", "openssl"]

[phases.install]
# legacy-peer-deps needed for this dependency tree
cmds = ["npm i -g npm", "npm install --no-frozen-lockfile"]

[phases.build]
# Prisma generate needs DATABASE_URL set (doesn't connect, just reads the schema)
cmds = [
  "npx prisma generate",
  "npm run build"
]

[phases.build.variables]
DATABASE_URL = "postgresql://dummy:dummy@localhost:5432/dummy"

[start]
cmd = "npx prisma generate && npx prisma db push && cp -r .next/static .next/standalone/.next/static && cp -r public .next/standalone/public && node .next/standalone/server.js"
